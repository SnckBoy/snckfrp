<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SnckFRP · Control plane</title>
<style>
:root{color-scheme:dark;--bg:#111014;--panel:#1a171e;--panel2:#211d26;--line:#342d3a;--text:#f4eff7;--muted:#a99eae;--accent:#b78ae8;--accent2:#8f63c4;--good:#77c7a0;--bad:#e38b91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -15%,#382748 0%,transparent 55%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;transition:.18s}button:hover{border-color:var(--accent);transform:translateY(-1px)}button.primary{background:var(--accent2);border-color:var(--accent2);color:white}button.danger{color:#f2a3a8}.shell{max-width:1180px;margin:auto;padding:30px 22px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#c69aef,#8053b5);display:grid;place-items:center;color:#17111e;font-weight:900}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}.side,.content,.card{background:rgba(26,23,30,.94);border:1px solid var(--line);border-radius:16px}.side{padding:16px;height:max-content}.side h3{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:4px 8px 12px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;border-color:transparent;background:transparent}.nav button.active{background:#30243b;border-color:#4b365c;color:#e5cafa}.content{padding:24px;min-height:600px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.heading h1{margin:0;font-size:25px;letter-spacing:-.03em}.heading p{margin:5px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.card{padding:16px}.kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.value{font-size:25px;font-weight:700;margin-top:5px}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#1d1921}.item strong{display:block}.item small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#120f15;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.hidden{display:none!important}.login{max-width:420px;margin:9vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.login h1{margin:24px 0 5px}.notice{padding:11px 13px;border-radius:10px;background:#2b2333;color:#d9c2ef;margin:12px 0}.status{color:var(--good)}.error{color:var(--bad)}.config{white-space:pre;overflow:auto;background:#100d12;border:1px solid var(--line);padding:14px;border-radius:12px;color:#ddc9ee;max-height:360px}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}dialog{width:min(540px,calc(100% - 24px));border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:22px;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#08060bbd;backdrop-filter:blur(5px)}dialog h2{margin:0 0 18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.help{font-size:12px;color:var(--muted)}@media(max-width:760px){.shell{padding:18px 12px}.grid{grid-template-columns:1fr}.side{padding:10px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.cards{grid-template-columns:1fr}.content{padding:16px}.heading{flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<section id="login" class="login"><div class="brand"><div class="mark">S</div>SnckFRP</div><h1>Welcome back</h1><p class="muted">Sign in to manage your tunnels and client profiles.</p><form id="loginForm" class="list"><div class="field"><label>Administrator</label><input name="username" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><button class="primary">Sign in</button><div id="loginError" class="error"></div></form></section>
<main id="main" class="shell hidden"><header class="top"><div class="brand"><div class="mark">S</div>SnckFRP <span class="muted" style="font-size:12px;font-weight:500">CONTROL PLANE</span></div><button id="logout">Sign out</button></header><div class="grid"><aside class="side"><h3>Workspace</h3><nav class="nav"><button class="active" data-view="overview">Overview</button><button data-view="profiles">Client profiles</button><button data-view="settings">Settings</button></nav><p class="muted" style="font-size:12px;margin:22px 8px 4px">FRP server <span class="status">● configured</span></p></aside><section class="content"><div id="view"></div></section></div></main>
<dialog id="profileDialog"><form id="profileForm"><h2 id="profileTitle">New client profile</h2><input type="hidden" name="id"><div class="field"><label>Device or client name</label><input name="name" maxlength="64" placeholder="My Windows PC" required></div><div class="dialog-actions"><button type="button" onclick="$('#profileDialog').close()">Cancel</button><button class="primary">Save profile</button></div></form></dialog>
<dialog id="tunnelDialog"><form id="tunnelForm"><h2 id="tunnelTitle">Add tunnel</h2><input type="hidden" name="id"><div class="form"><div class="field"><label>Tunnel name</label><input name="name" maxlength="48" pattern="[A-Za-z0-9_-]+" placeholder="web" required></div><div class="field"><label>Protocol</label><select name="type"><option value="tcp">TCP</option><option value="udp">UDP</option><option value="http">HTTP</option><option value="https">HTTPS</option></select></div><div class="field"><label>Local IP</label><input name="localIp" value="127.0.0.1" required></div><div class="field"><label>Local port</label><input name="localPort" type="number" min="1" max="65535" value="8080" required></div><div class="field" id="remoteField"><label>Public remote port (0 = automatic)</label><input name="remotePort" type="number" min="0" max="65535" value="0"></div><div class="field hidden" id="domainField"><label>Public domain</label><input name="domain" placeholder="app.example.com"></div></div><p class="help">HTTP/HTTPS requires the matching vhost listener and DNS record on your FRP server.</p><div class="dialog-actions"><button type="button" onclick="$('#tunnelDialog').close()">Cancel</button><button class="primary">Save tunnel</button></div></form></dialog>
<script>
let csrf='',session=null,activeProfile=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(csrf&&opts.method&&opts.method!=='GET')opts.headers['X-CSRF-Token']=csrf;const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.headers.get('content-type')?.includes('json')?r.json():r.text()}
function showLogin(){$('#login').classList.remove('hidden');$('#main').classList.add('hidden')}function showMain(){$('#login').classList.add('hidden');$('#main').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const f=new FormData(e.target);try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});csrf=d.csrf;await load();showMain()}catch(err){$('#loginError').textContent='Sign-in failed. Check your credentials.'}});
$('#logout').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}csrf='';showLogin()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render(b.dataset.view)});
async function load(){session=await api('/api/session');csrf=session.csrf;render('overview')}function render(view){if(view==='overview')overview();if(view==='profiles')profiles();if(view==='settings')settings()}
function overview(){const p=session.profiles||[];$('#view').innerHTML=`<div class="heading"><div><h1>Overview</h1><p>Your FRP control plane at a glance.</p></div><button class="primary" onclick="newProfile()">＋ New client profile</button></div><div class="cards"><div class="card"><div class="kicker">Client profiles</div><div class="value">${p.length}</div></div><div class="card"><div class="kicker">Configured tunnels</div><div class="value">${p.reduce((n,x)=>n+x.tunnels.length,0)}</div></div><div class="card"><div class="kicker">FRP server port</div><div class="value">${session.serverPort}</div></div></div><div class="toolbar"><strong>Recent client profiles</strong><button onclick="render('profiles')">View all</button></div>${p.length?`<div class="list">${p.slice(0,5).map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${x.tunnels.length} tunnels · created ${new Date(x.createdAt).toLocaleDateString()}</small></div><button onclick="openProfile('${x.id}')">Manage →</button></div>`).join('')}</div>`:'<div class="empty">No client profiles yet. Create one to get started.</div>'}`}
function profiles(){const p=session.profiles||[];$('#view').innerHTML=`<div class="heading"><div><h1>Client profiles</h1><p>One profile per PC or device. Each profile has its own private setup link.</p></div><button class="primary" onclick="newProfile()">＋ Create profile</button></div>${p.length?`<div class="list">${p.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${x.tunnels.length} tunnels · ${x.id}</small></div><div class="actions"><button onclick="openProfile('${x.id}')">Manage</button><button class="danger" onclick="deleteProfile('${x.id}')">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No profiles created yet.</div>'}`}
function findProfile(id){return session.profiles.find(x=>x.id===id)}
function newProfile(){profileForm(null)}function profileForm(p){const f=$('#profileForm');f.reset();f.elements.id.value=p?.id||'';f.elements.name.value=p?.name||'';$('#profileTitle').textContent=p?'Edit profile':'New client profile';$('#profileDialog').showModal()}
$('#profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');try{if(id)await api('/api/profiles/'+id,{method:'PATCH',body:JSON.stringify({name:f.get('name')})});else await api('/api/profiles',{method:'POST',body:JSON.stringify({name:f.get('name')})});$('#profileDialog').close();await load();render('profiles')}catch(err){alert(err.message)}};
async function deleteProfile(id){if(!confirm('Delete this profile and all its tunnel definitions?'))return;try{await api('/api/profiles/'+id,{method:'DELETE',body:'{}'});await load();render('profiles')}catch(e){alert(e.message)}}
function openProfile(id){activeProfile=id;profileView()}
function profileView(){const p=findProfile(activeProfile);if(!p)return render('profiles');$('#view').innerHTML=`<div class="heading"><div><button onclick="render('profiles')">← Profiles</button><h1 style="margin-top:12px">${esc(p.name)}</h1><p>Manage tunnels and client configuration for this device.</p></div><div class="actions"><button onclick="profileForm(findProfile('${p.id}'))">Edit profile</button><button onclick="copySetupCommand('${p.id}')">Copy setup command</button><button onclick="downloadConfig('${p.id}')">Download config</button><button class="primary" onclick="newTunnel()">＋ Add tunnel</button></div></div><div class="notice">FRP uses one server-wide authentication token. This profile has a separate private setup key; it is not a separate FRP auth token. Install the frpc binary on the client first, then use the setup command to fetch its configuration.</div><div class="toolbar"><strong>Tunnels</strong><span class="muted">${p.tunnels.length} total</span></div>${p.tunnels.length?`<div class="list">${p.tunnels.map(t=>`<div class="item"><div><strong>${esc(t.name)} <span class="muted">· ${t.type.toUpperCase()}</span></strong><small>${esc(t.localIp)}:${t.localPort} → ${t.type==='tcp'||t.type==='udp'?':'+t.remotePort:esc(t.domain)}</small></div><div class="actions"><button onclick="editTunnel('${t.id}')">Edit</button><button class="danger" onclick="deleteTunnel('${t.id}')">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">This profile has no tunnels. Add a tunnel to generate its client config.</div>'}<div class="toolbar"><strong>Client configuration</strong><button onclick="downloadConfig('${p.id}')">Download TOML</button></div><pre id="config" class="config">Loading configuration…</pre>`;loadConfig(p.id)}
async function loadConfig(id){try{$('#config').textContent=await api('/api/profiles/'+id+'/config')}catch(e){$('#config').textContent=e.message}}
async function downloadConfig(id){const r=await fetch('/api/profiles/'+id+'/config');if(!r.ok){alert('Could not download config');return}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='frpc-'+id+'.toml';a.click();URL.revokeObjectURL(a.href)}
async function copySetupCommand(id){const p=findProfile(id),base=(session.panelUrl||location.origin).replace(/\/$/,''),url=base+'/bootstrap/'+p.id+'/'+p.key,cmd="curl -fsSL '"+url+"' -o frpc.toml && frpc -c frpc.toml";try{await navigator.clipboard.writeText(cmd);alert('Setup command copied')}catch{prompt('Copy this command (frpc must already be installed)',cmd)}}
function newTunnel(){tunnelForm(null)}function editTunnel(id){const p=findProfile(activeProfile);tunnelForm(p.tunnels.find(x=>x.id===id))}
function tunnelForm(t){const f=$('#tunnelForm');f.reset();f.elements.id.value=t?.id||'';f.elements.name.value=t?.name||'';f.elements.type.value=t?.type||'tcp';f.elements.localIp.value=t?.localIp||'127.0.0.1';f.elements.localPort.value=t?.localPort||8080;f.elements.remotePort.value=t?.remotePort||0;f.elements.domain.value=t?.domain||'';$('#tunnelTitle').textContent=t?'Edit tunnel':'Add tunnel';toggleTunnelFields();$('#tunnelDialog').showModal()}
function toggleTunnelFields(){const type=$('#tunnelForm').elements.type.value,web=type==='http'||type==='https';$('#remoteField').classList.toggle('hidden',web);$('#domainField').classList.toggle('hidden',!web)}$('#tunnelForm').elements.type.onchange=toggleTunnelFields;
$('#tunnelForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id'),body={name:f.get('name'),type:f.get('type'),localIp:f.get('localIp'),localPort:Number(f.get('localPort')),remotePort:Number(f.get('remotePort')||0),domain:f.get('domain'),enabled:true};try{if(id)await api('/api/profiles/'+activeProfile+'/tunnels/'+id,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/profiles/'+activeProfile+'/tunnels',{method:'POST',body:JSON.stringify(body)});$('#tunnelDialog').close();await load();profileView()}catch(err){alert(err.message)}};
async function deleteTunnel(id){if(!confirm('Delete this tunnel?'))return;try{await api('/api/profiles/'+activeProfile+'/tunnels/'+id,{method:'DELETE',body:'{}'});await load();profileView()}catch(e){alert(e.message)}}
function settings(){$('#view').innerHTML=`<div class="heading"><div><h1>Settings</h1><p>Configure the address clients use to reach your FRP server.</p></div></div><form id="settingsForm" class="form"><div class="field full"><label>FRP server public IP or hostname</label><input name="serverAddr" value="${esc(session.serverAddr)}" required></div><div class="field full"><label>Panel public URL (optional, used for setup links)</label><input name="panelUrl" value="${esc(session.panelUrl)}" placeholder="http://your-vps-ip:8080"></div><div class="field full"><button class="primary">Save settings</button></div></form><p class="muted">FRP server port: ${session.serverPort}. Ensure the VPS firewall and cloud firewall allow the FRP port and each public tunnel port.</p>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/settings',{method:'PATCH',body:JSON.stringify({serverAddr:f.get('serverAddr'),panelUrl:f.get('panelUrl')})});await load();alert('Settings saved')}catch(err){alert(err.message)}}}
async function boot(){try{await load();showMain()}catch{showLogin()}}boot();
</script></body></html>
