name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build FRP and SnckFRP panel
        run: |
          make build
          mkdir -p bin
          go build -trimpath -o bin/snckfrp-panel ./cmd/snckfrp-panel
      - name: Verify binaries
        run: |
          ./bin/frpc --version
          ./bin/frps --version
          ./bin/snckfrp-panel -h
      - name: Run SnckFRP panel unit tests
        run: go test ./cmd/snckfrp-panel/...
