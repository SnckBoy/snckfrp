name: Extract FRP source archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - EXTRACT-FRP-NOW

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive = pathlib.Path('frp-dev.zip')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frp-extract'
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if p.is_absolute() or '..' in p.parts or not item.filename.startswith('frp-dev/'):
                      raise SystemExit(f'Unsafe archive path: {item.filename!r}')
                  if p.parts[:3] == ('frp-dev', '.github', 'workflows'):
                      print(f'Skipping upstream workflow file: {item.filename}')
                      continue
                  if stat.S_ISLNK(mode):
                      print(f'Skipping symlink entry: {item.filename}')
                      continue
                  if mode and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)):
                      raise SystemExit(f'Unsupported special file: {item.filename!r}')
                  z.extract(item, destination)
          PY
          mkdir -p archives
          mv frp-dev.zip archives/frp-dev.zip
          cp -a "$RUNNER_TEMP/frp-extract/frp-dev/." .
          cat > SOURCE_ORIGIN.md <<'EOF'
          # Source provenance

          This repository contains an extracted source snapshot of [fatedier/frp](https://github.com/fatedier/frp).

          The supplied archive did not include a verifiable upstream commit identifier, so this copy is a snapshot rather than a pinned upstream revision. The upstream LICENSE file is retained; preserve its notices when redistributing or modifying the source.

          The archive's GitHub Actions workflow files are not imported; this repository's own workflow configuration is preserved. One symlink entry (CLAUDE.md -> AGENTS.md) is omitted; its target file, AGENTS.md, is retained.
          EOF
          rm -f EXTRACT-FRP-NOW
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Extract FRP source tree"
            git push
          fi
